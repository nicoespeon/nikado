<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap"
			rel="stylesheet"
		/>
		<title>Nikado</title>
		<meta
			name="description"
			content="A visual tool for the Mikado method. Decompose goals into sub-tasks and work from leaf nodes up."
		/>

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:title" content="Nikado" />
		<meta
			property="og:description"
			content="A visual tool for the Mikado method. Decompose goals into sub-tasks and work from leaf nodes up."
		/>
		<meta property="og:image" content="https://nikado.app/og-image.png" />
		<meta property="og:url" content="https://nikado.app/" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Nikado" />
		<meta
			name="twitter:description"
			content="A visual tool for the Mikado method. Decompose goals into sub-tasks and work from leaf nodes up."
		/>
		<meta name="twitter:image" content="https://nikado.app/og-image.png" />
		<script>
			(function () {
				var theme = localStorage.getItem("nikado-theme") || "system";
				var dark =
					theme === "dark" ||
					(theme === "system" &&
						window.matchMedia("(prefers-color-scheme: dark)").matches);
				if (dark) document.documentElement.classList.add("dark");
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
